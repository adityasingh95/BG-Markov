name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# ★ So that a cancelled run has a KNOWN cause.
#
# Runs #105 and #106 both stopped at 15m00s with conclusion `cancelled` and no retained logs.
# `cancelled` is not something a failing test produces, and nothing in this file could account
# for it. With a concurrency group, a superseded run is cancelled *by the run that replaced
# it* and the UI says so — leaving any other cancellation as a genuine signal worth chasing
# rather than one more thing that might be normal.
#
# Keyed per-ref: a push to one branch must never cancel another branch's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # ★ The suite takes ~5 minutes. Without a ceiling a hung job runs to GitHub's 6-hour
    # default, which is indistinguishable from "CI is broken" and burns the runner minutes
    # the next push needs. Twenty is a hang detector, not a performance budget — tight enough
    # to be useful, loose enough that a slow-but-healthy run is never clipped. A timeout that
    # clips healthy runs is worse than none: it teaches the reader that red means nothing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pinned deps + dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # S-102 accessibility tests drive a real Chromium via Playwright.
      - name: Install Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      # AC: ruff clean. Also proves the lint gate is wired into CI.
      - name: Lint (ruff)
        run: ruff check .

      # AC: mypy --strict clean on core (+ api S-102, + data S-201, + cli S-304,
      # + features S-401, + models S-501).
      - name: Types (mypy --strict)
        run: mypy --strict core api data cli features models prescribe synthetic

      # AC: pytest clean + coverage gate at 90% on core + features (audit A1).
      # The toolchain tests additionally assert the ruff/mypy gates BITE on a
      # deliberate lint error and a deliberate type error (S-101 TDD).
      - name: Tests + coverage gate
        run: pytest --cov=core --cov=features --cov=models --cov=prescribe --cov=data.predictions --cov=api.presenters --cov-report=term-missing --cov-fail-under=90
